<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="340 320 1300 1300" width="512" height="512" role="img" aria-label="Music player logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="gOuter" gradientUnits="userSpaceOnUse" x1="700" y1="500" x2="1180" y2="790">
      <stop offset="0.35" stop-color="#4a0000"/>
      <stop offset="0.75" stop-color="#7a1a0a"/>
      <stop offset="1" stop-color="#b24a16"/>
    </linearGradient>
    <linearGradient id="gInnerUp" gradientUnits="userSpaceOnUse" x1="760" y1="760" x2="1040" y2="930">
      <stop offset="0" stop-color="#4a0000"/>
      <stop offset="0.45" stop-color="#7a1a0a"/>
      <stop offset="1" stop-color="#e8832a"/>
    </linearGradient>
    <linearGradient id="gInnerLow" gradientUnits="userSpaceOnUse" x1="1030" y1="1000" x2="620" y2="1360">
      <stop offset="0" stop-color="#e8832a"/>
      <stop offset="0.45" stop-color="#8a2208"/>
      <stop offset="1" stop-color="#4a0000"/>
    </linearGradient>
    <linearGradient id="gStem" gradientUnits="userSpaceOnUse" x1="0" y1="428" x2="0" y2="1240">
      <stop offset="0" stop-color="#e8832a"/>
      <stop offset="0.25" stop-color="#e8832a"/>
      <stop offset="0.7" stop-color="#7a1a0a"/>
      <stop offset="1" stop-color="#4a0000"/>
    </linearGradient>
    <linearGradient id="gRight" gradientUnits="userSpaceOnUse" x1="1253" y1="0" x2="1340" y2="0">
      <stop offset="0" stop-color="#5a0a00"/>
      <stop offset="1" stop-color="#e8832a"/>
    </linearGradient>
    <radialGradient id="gFill" gradientUnits="userSpaceOnUse" cx="1000" cy="990" r="380">
      <stop offset="0" stop-color="#e8832a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#e8832a" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <!-- travelling light streaks (shared by sharp + glow copies) -->
    <g id="comets" fill="none" stroke="#fff1d2" stroke-width="26" stroke-linecap="round">
      <path class="comet c1" pathLength="1"
            d="M514 1285V585C514 520 550 474 612 474C640 474 660 485 690 503L1180 782"/>
      <path class="comet c2" pathLength="1"
            d="M695 1165V815C695 775 725 755 752 755C775 755 790 765 810 777L1060 920C1090 940 1092 1000 1062 1022L580 1296C530 1325 505 1370 520 1410C535 1455 580 1485 625 1480C650 1478 665 1465 685 1453L962 1292"/>
      <path class="comet c3" pathLength="1"
            d="M1253 825L1350 882C1395 910 1415 960 1385 1005C1375 1020 1360 1030 1345 1038L1253 1092"/>
      <path class="comet c4" pathLength="1"
            d="M1230 428V1235C1230 1320 1170 1385 1095 1380C1040 1375 1005 1340 1008 1295C1012 1245 1060 1205 1120 1180Q1155 1165 1182 1150"/>
      <path class="comet c5" pathLength="1"
            d="M1228 440C1245 540 1290 610 1360 660C1430 715 1485 770 1488 830C1490 870 1478 905 1455 925"/>
    </g>
  </defs>

  <style>
    /* ---------- intro: strokes draw themselves ---------- */
    .line { fill: none; stroke-width: 48; stroke-dasharray: 1.02; stroke-dashoffset: 1.02;
            animation: draw 1.5s cubic-bezier(.65,0,.35,1) forwards; }
    .p1 { animation-delay: .3s; }
    .p2 { animation-delay: .7s; animation-duration: 2s; }
    .p3 { animation-delay: 1.6s; animation-duration: 1.1s; }
    .p4 { animation-delay: 1.2s; animation-duration: 1.6s; }
    .p5 { animation-delay: 2.2s; animation-duration: 1s; }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    #fill { opacity: 0; animation: fillIn 1.2s ease 2.6s forwards, fillPulse 3s ease-in-out 3.8s infinite; }
    @keyframes fillIn    { to { opacity: 1; } }
    @keyframes fillPulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }

    /* ---------- light streaks racing along every line ---------- */
    .comet { stroke-dasharray: .13 1.3; stroke-dashoffset: .13;
             animation: comet 4.8s cubic-bezier(.45,.05,.55,.95) infinite backwards; }
    .c1 { animation-delay: 3.4s; }
    .c2 { animation-delay: 3.7s; animation-duration: 5.2s; }
    .c3 { animation-delay: 4.3s; }
    .c4 { animation-delay: 4.0s; animation-duration: 5s; }
    .c5 { animation-delay: 4.6s; }
    @keyframes comet {
      0%   { stroke-dashoffset: .13; }
      50%  { stroke-dashoffset: -1; }
      100% { stroke-dashoffset: -1; }
    }
    #cometGlow { opacity: .9; }

    /* ---------- mark entrance + idle float ---------- */
    #mark { transform-box: view-box; transform-origin: 990px 970px;
            animation: enter 1.1s cubic-bezier(.22,1,.36,1) both,
                       float 6s ease-in-out 3.5s infinite; }
    @keyframes enter { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes float { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-9px) rotate(.8deg); } }

    /* ---------- orbit ring ---------- */
    #ring { opacity: 0; animation: ringIn 1.2s ease 2.8s forwards; }
    @keyframes ringIn { to { opacity: 1; } }
    #orbit { transform-box: view-box; transform-origin: 990px 970px;
             animation: spin 7s linear 2.8s infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #ringDash { transform-box: view-box; transform-origin: 990px 970px;
                animation: spin 90s linear infinite reverse; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .line { stroke-dashoffset: 0; }
      #fill, #ring { opacity: 1; }
      .comet, #cometGlow, #orbit { display: none; }
    }
  </style>

  <!-- orbit ring (behind the mark) -->
  

  <g id="mark">
    <!-- soft glass fill inside the play triangle -->
    <path id="fill" fill="url(#gFill)" d="M695 1165V815C695 775 725 755 752 755C775 755 790 765 810 777L1060 920C1090 940 1092 1000 1062 1022L695 1231Z"/>

    <!-- main strokes -->
    <path class="line p1" pathLength="1" stroke="url(#gOuter)"
          d="M514 1285V585C514 520 550 474 612 474C640 474 660 485 690 503L1180 782"/>
    <path class="line p2" pathLength="1" stroke="url(#gInnerUp)"
          d="M695 1165V815C695 775 725 755 752 755C775 755 790 765 810 777L1060 920C1090 940 1092 1000 1062 1022"/>
    <path class="line p2" pathLength="1" stroke="url(#gInnerLow)" style="animation-delay:2s;animation-duration:1.2s"
          d="M1062 1022L580 1296C530 1325 505 1370 520 1410C535 1455 580 1485 625 1480C650 1478 665 1465 685 1453L962 1292"/>
    <path class="line p3" pathLength="1" stroke="url(#gRight)"
          d="M1253 825L1350 882C1395 910 1415 960 1385 1005C1375 1020 1360 1030 1345 1038L1253 1092"/>
    <path class="line p4" pathLength="1" stroke="url(#gStem)"
          d="M1230 428V1235C1230 1320 1170 1385 1095 1380C1040 1375 1005 1340 1008 1295C1012 1245 1060 1205 1120 1180Q1155 1165 1182 1150"/>
    <path class="line p5" pathLength="1" stroke="#e8832a"
          d="M1228 440C1245 540 1290 610 1360 660C1430 715 1485 770 1488 830C1490 870 1478 905 1455 925"/>

    <!-- light streaks: glow copy + sharp copy -->
    <use id="cometGlow" href="#comets" xlink:href="#comets" filter="url(#blur)"/>
    <use href="#comets" xlink:href="#comets"/>
  </g>
</svg>
